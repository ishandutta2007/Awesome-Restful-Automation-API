<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1);opacity:.25}50%{transform:scale(1.18);opacity:.45}}@keyframes floatPill1{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-10px) translateX(5px)}}@keyframes floatPill2{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(8px) translateX(-6px)}}@keyframes flowPath{0%{stroke-dashoffset:200}}.orb-glow{transform-origin:center;animation:pulseOrb 6s ease-in-out infinite}.pill-1{animation:floatPill1 5s ease-in-out infinite}.pill-2{animation:floatPill2 6s ease-in-out infinite}.flow-line{stroke-dasharray:12,12;animation:flowPath 8s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/><circle cx="150" cy="100" r="120" fill="#38bdf8" class="orb-glow" filter="url(#glow)"/><circle cx="1050" cy="260" r="130" fill="#818cf8" class="orb-glow" filter="url(#glow)" style="animation-delay:-3s"/><path fill="none" stroke="url(#glowLine)" stroke-width="1.5" d="M 0 100 Q 300 40 600 100 T 1200 100" class="flow-line"/><path fill="none" stroke="url(#glowLine)" stroke-width="1.5" d="M 0 280 Q 300 340 600 280 T 1200 280" class="flow-line" style="animation-duration:11s"/><g class="pill-1" transform="translate(80, 45)"><rect width="130" height="32" fill="#1e293b" fill-opacity=".8" stroke="#38bdf8" stroke-width="1" rx="16"/><text x="65" y="21" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">⚡ GET /api/v1</text></g><g class="pill-2" transform="translate(980, 50)"><rect width="140" height="32" fill="#1e293b" fill-opacity=".8" stroke="#34d399" stroke-width="1" rx="16"/><text x="70" y="21" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">🟢 200 OK • 12ms</text></g><g class="pill-1" transform="translate(990, 290)"><rect width="130" height="32" fill="#1e293b" fill-opacity=".8" stroke="#c084fc" stroke-width="1" rx="16"/><text x="65" y="21" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">🚀 REST Automation</text></g><g class="pill-2" transform="translate(70, 290)"><rect width="140" height="32" fill="#1e293b" fill-opacity=".8" stroke="#f59e0b" stroke-width="1" rx="16"/><text x="70" y="21" fill="#f59e0b" font-size="12" font-weight="600" text-anchor="middle">🛡️ API Gateway</text></g><g id="foreground-content"><text x="600" y="145" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-.5" text-anchor="middle">Awesome RESTful Automation API</text><text x="600" y="195" fill="#f1f5f9" font-size="19" font-weight="500" text-anchor="middle">Curated Enterprise SaaS &amp; High-Performance Open-Source API Solutions</text><text x="600" y="235" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Design • Mock • Automate • Test • Secure • Gateway &amp; Traffic Management</text><g transform="translate(390, 258)"><rect width="95" height="26" x="0" y="0" fill="#0f172a" stroke="#334155" rx="13"/><text x="47" y="17" fill="#