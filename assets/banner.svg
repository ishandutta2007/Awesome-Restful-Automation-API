<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.45; }
      100% { transform: scale(1); opacity: 0.25; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-10px) translateX(5px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(8px) translateX(-6px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes flowPath {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .pill-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }
    .pill-2 {
      animation: floatPill2 6s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 12, 12;
      animation: flowPath 8s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="orb-glow" cx="150" cy="100" r="120" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-glow" cx="1050" cy="260" r="130" fill="#818cf8" filter="url(#glow)" style="animation-delay:-3s;" />

  <!-- Flowing Network Grid Lines -->
  <path class="flow-line" d="M 0 100 Q 300 40 600 100 T 1200 100" fill="none" stroke="url(#glowLine)" stroke-width="1.5" />
  <path class="flow-line" d="M 0 280 Q 300 340 600 280 T 1200 280" fill="none" stroke="url(#glowLine)" stroke-width="1.5" style="animation-duration:11s;" />

  <!-- Floating Dynamic Pills / Cards (Background/Accent Layer) -->
  <g class="pill-1" transform="translate(80, 45)">
    <rect width="130" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="21" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">⚡ GET /api/v1</text>
  </g>

  <g class="pill-2" transform="translate(980, 50)">
    <rect width="140" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#34d399" stroke-width="1" />
    <text x="70" y="21" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">🟢 200 OK • 12ms</text>
  </g>

  <g class="pill-1" transform="translate(990, 290)">
    <rect width="130" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#c084fc" stroke-width="1" />
    <text x="65" y="21" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">🚀 REST Automation</text>
  </g>

  <g class="pill-2" transform="translate(70, 290)">
    <rect width="140" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1" />
    <text x="70" y="21" fill="#f59e0b" font-size="12" font-weight="600" text-anchor="middle">🛡️ API Gateway</text>
  </g>

  <!-- Title & Subtitle (Foreground Layer - Clear, Centered & Readable) -->
  <g id="foreground-content">
    <text x="600" y="145" text-anchor="middle" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome RESTful Automation API</text>
    <text x="600" y="195" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="500">Curated Enterprise SaaS &amp; High-Performance Open-Source API Solutions</text>
    <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400">Design • Mock • Automate • Test • Secure • Gateway &amp; Traffic Management</text>

    <!-- Mini Feature Badges -->
    <g transform="translate(390, 258)">
      <rect x="0" y="0" width="95" height="26" rx="13" fill="#0f172a" stroke="#334155" />
      <text x="47" y="17" fill="#cbd5e1" font-size="11" text-anchor="middle">⚡ CI/CD Tests</text>

      <rect x="110" y="0" width="105" height="26" rx="13" fill="#0f172a" stroke="#334155" />
      <text x="162" y="17" fill="#cbd5e1" font-size="11" text-anchor="middle">🌐 Gateways</text>

      <rect x="230" y="0" width="100" height="26" rx="13" fill="#0f172a" stroke="#334155" />
      <text x="280" y="17" fill="#cbd5e1" font-size="11" text-anchor="middle">🔒 Governance</text>

      <rect x="345" y="0" width="90" height="26" rx="13" fill="#0f172a" stroke="#334155" />
      <text x="390" y="17" fill="#cbd5e1" font-size="11" text-anchor="middle">📊 Observability</text>
    </g>
  </g>
</svg>